# Temporary run configuration for artisanhosting.net.
# This mirrors the main config but targets the requested domain/site.

domain = "artisanhosting.net"
include = ["*.artisanhosting.net"]
exclude = []

[scope]
mode = "domain_sweep"
# site is only used in single_site mode.

[psi]
enabled = false
strategies = ["mobile", "desktop"]
categories = ["performance", "accessibility", "best-practices", "seo"]
timeout_seconds = 120

[execution]
max_workers = 4
per_host_concurrency = 2

[report]
formats = ["html"]
css = "report/assets/custom.css"
