# Single-site verification config for artisanhosting.net.

domain = "artisanhosting.net"
include = ["www.artisanhosting.net"]
exclude = []

[scope]
mode = "single_site"
site = "www.artisanhosting.net"

[psi]
enabled = false
strategies = ["mobile", "desktop"]
categories = ["performance", "accessibility", "best-practices", "seo"]
timeout_seconds = 120

[execution]
max_workers = 4
per_host_concurrency = 2

[report]
formats = ["json", "html"]
css = "report/assets/custom.css"
