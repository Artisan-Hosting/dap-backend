# DNS email posture manifest. The trigger matches TXT records so the runner can
# evaluate mail authentication posture passively.
id: dns_dmarc_policy
name: Email authentication posture
version: 0.2.0
entrypoint: run.py
runtime: python
triggers:
  any:
    - entity: dns_record
      where:
        type: TXT
limits:
  timeout_seconds: 20
  memory_mb: 64
env: []
